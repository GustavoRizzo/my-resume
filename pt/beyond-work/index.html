tou contribuindo com uma biblioteca de componentes &lt;b&gt;Django&amp;nbsp;+&amp;nbsp;HTMX&lt;/b&gt;, onde venho reunindo os padrões que uso todos os dias enquanto construo projetos reais.&lt;/p&gt;&quot;],&quot;images&quot;:[1,[]],&quot;links&quot;:[1,[[0,{&quot;label&quot;:[0,&quot;django-sample-components&quot;],&quot;url&quot;:[0,&quot;https://pypi.org/project/django-sample-components/&quot;],&quot;note&quot;:[0,&quot;PyPI&quot;]}]]]}],[0,{&quot;id&quot;:[0,&quot;side-projects&quot;],&quot;emoji&quot;:[0,&quot;🛠️&quot;],&quot;title&quot;:[0,&quot;Ferramentas &amp; Passatempos que Crio&quot;],&quot;summary&quot;:[0,&quot;Pegando pequenos incômodos do dia a dia e programando minha própria solução.&quot;],&quot;body_html&quot;:[0,&quot;&lt;p&gt;Adoro pegar um pequeno problema do dia a dia e construir minha própria solução para ele. Aqui estão alguns deles:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Quem?&lt;/b&gt; — uma versão web gratuita e sem anúncios do jogo de festa \&quot;Quem sou eu?\&quot; que jogo com os amigos. Os apps na Play Store são tomados por anúncios e barreiras pagas, então criei o meu próprio.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Conversor PTAX&lt;/b&gt; — no Brasil, faturar para clientes estrangeiros significa converter os valores usando uma taxa especial do Banco Central. O site oficial é difícil de usar, então peguei a API deles e a embrulhei em uma interface mais agradável.&lt;/li&gt;&lt;/ul&gt;&quot;],&quot;images&quot;:[1,[]],&quot;links&quot;:[1,[[0,{&quot;label&quot;:[0,&quot;Jogar \&quot;Quem?\&quot;&quot;],&quot;url&quot;:[0,&quot;https://gustavorizzo.github.io/game-quem-sou-eu/&quot;],&quot;note&quot;:[0,&quot;Grátis · só PT-BR&quot;]}],[0,{&quot;label&quot;:[0,&quot;Conversor PTAX&quot;],&quot;url&quot;:[0,&quot;https://gustavorizzo.github.io/conversor-ptax-logger/&quot;],&quot;note&quot;:[0,&quot;Grátis · só PT-BR&quot;]}]]]}],[0,{&quot;id&quot;:[0,&quot;tech-events&quot;],&quot;emoji&quot;:[0,&quot;🏆&quot;],&quot;title&quot;:[0,&quot;Eventos de
