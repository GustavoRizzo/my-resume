name: Deploy

# The site is published to TWO independent hosts (see deploy-targets.mjs):
#   - GitHub Pages  → https://gustavorizzo.github.io/my-resume/
#   - Cloudflare    → https://resume.bygus.dev/
# Each deploy job builds its own dist/ (different site/base) and runs in
# parallel after lint+test: one failing never blocks the other, and either
# can be switched off from the repo settings without touching code.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   DEPLOY_GH_PAGES    "false" disables the GitHub Pages job (on by default).
#   DEPLOY_CLOUDFLARE  "true" enables the Cloudflare job (off until set).
#   CANONICAL_TARGET   "cloudflare" (default) or "gh-pages": the host every copy
#                      names as canonical. Switch it if you drop that host.
# Repository secrets (Cloudflare job only):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches:
      - main
  workflow_dispatch: # manual re-run, e.g. after changing CANONICAL_TARGET

permissions:
  contents: read

# Never run two deploys of the same host at once; queue instead of cancelling.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint project
        run: npm run lint

      - name: Run tests
        run: npm test

  gh-pages:
    name: Deploy · GitHub Pages
    needs: check
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_GH_PAGES != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the gh-pages branch
    env:
      DEPLOY_TARGET: gh-pages
      CANONICAL_TARGET: ${{ vars.CANONICAL_TARGET }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages (base /my-resume)
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  cloudflare:
    name: Deploy · Cloudflare
    needs: check
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_CLOUDFLARE == 'true'
    runs-on: ubuntu-latest
    env:
      DEPLOY_TARGET: cloudflare
      CANONICAL_TARGET: ${{ vars.CANONICAL_TARGET }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare (base /)
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test https://resume.bygus.dev
        # A brand-new custom domain can take a few minutes to get its
        # certificate, so retry for up to ~3 minutes before failing.
        run: |
          for i in $(seq 1 18); do
            if curl -fsS -o /dev/null https://resume.bygus.dev/en/ \
              && curl -fsS https://resume.bygus.dev/robots.txt | grep -q "resume.bygus.dev"; then
              echo "resume.bygus.dev is up"; exit 0
            fi
            echo "not ready yet (attempt $i)"; sleep 10
          done
          echo "::error::resume.bygus.dev did not respond correctly after deploy"; exit 1
