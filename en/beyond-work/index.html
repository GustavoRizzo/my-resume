 a &lt;b&gt;Django&amp;nbsp;+&amp;nbsp;HTMX&lt;/b&gt; component library, where I&#39;ve been collecting the patterns I reach for every day while building real projects.&lt;/p&gt;&quot;],&quot;images&quot;:[1,[]],&quot;links&quot;:[1,[[0,{&quot;label&quot;:[0,&quot;django-sample-components&quot;],&quot;url&quot;:[0,&quot;https://pypi.org/project/django-sample-components/&quot;],&quot;note&quot;:[0,&quot;PyPI&quot;]}]]]}],[0,{&quot;id&quot;:[0,&quot;side-projects&quot;],&quot;emoji&quot;:[0,&quot;🛠️&quot;],&quot;title&quot;:[0,&quot;Tools &amp; Pastimes I Build&quot;],&quot;summary&quot;:[0,&quot;Taking small everyday annoyances and coding my own fix.&quot;],&quot;body_html&quot;:[0,&quot;&lt;p&gt;I love taking a small everyday problem and building my own solution for it. Here are a couple of them:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Quem?&lt;/b&gt; — a free, ad-free web version of the \&quot;Who am I?\&quot; party game I play with friends. The Play Store apps are buried in ads and paywalls, so I built my own.&lt;/li&gt;&lt;li&gt;&lt;b&gt;PTAX Converter&lt;/b&gt; — in Brazil, invoicing foreign clients means converting the amounts using a special Central Bank rate. The official site is painful to use, so I took their API and wrapped it in a nicer interface.&lt;/li&gt;&lt;/ul&gt;&quot;],&quot;images&quot;:[1,[]],&quot;links&quot;:[1,[[0,{&quot;label&quot;:[0,&quot;Play \&quot;Quem?\&quot;&quot;],&quot;url&quot;:[0,&quot;https://gustavorizzo.github.io/game-quem-sou-eu/&quot;],&quot;note&quot;:[0,&quot;Free · PT-BR only&quot;]}],[0,{&quot;label&quot;:[0,&quot;PTAX Converter&quot;],&quot;url&quot;:[0,&quot;https://gustavorizzo.github.io/conversor-ptax-logger/&quot;],&quot;note&quot;:[0,&quot;Free · PT-BR only&quot;]}]]]}],[0,{&quot;id&quot;:[0,&quot;tech-events&quot;],&quot;emoji&quot;:[0,&quot;🏆&quot;],&quot;title&quot;:[0,&quot;Tech Events &amp; Hackathons&quot;],&quot;summary&quot;:[0,&quot;Meetups, conferences, and the thrill of winning my first hackathon.&quot;],&quot;body_html&quot;:[0,&quot;&lt;p&gt;I&#39;ve always loved going to tech events, because that&#39;s where you find the true enthusiasts of the field! 🤖 It all started back in college, tutoring classmates and taking part in the &lt;b&gt;IEEE&lt;/b&gt; (Institute of Electrical and Electronics Engineers). And I&#39;ll never forget the moment I won my first &lt;b&gt;Hackathon&lt;/b&gt;. 🏆 To this day, whenever I can, I go to events and watch my friends give talks.&lt;/p&gt;&quot;],&quot;images&quot;:[1,[[0,{&quot;src&quot;:[0,&quot;hobbies/tech-events-1-inov-week.webp&quot;],&quot;alt&quot;:[0,&quot;Photo mosaic from Inov Week&quot;]}],[0,{&quot;src&quot;:[0,&quot;hobbies/tech-events-2-vista.webp&quot;],&quot;alt&quot;:[0,&quot;View of the HackingRio event venue&quot;]}],[0,{&quot;src&quot;:[0,&quot;hobbies/tech-events-3-time.webp&quot;],&quot;alt&quot;:[0,&quot;My team at HackingRio&quot;]}],[0,{&quot;src&quot;:[0,&quot;hobbies/tech-events-4-premio.webp&quot;],&quot;alt&quot;:[0,&quot;Receiving the hackathon prize&quot;]}],[0,{&quot;src&quot;:[0,&quot;hobbies/tech-events-5-ieee.webp&quot;],&quot;alt&quot;:[0,&quot;With the IEEE group in college&quot;]}]]],&quot;links&quot;:[1,[]]}]]]}],&quot;labels&quot;:[0,{&quot;readMore&quot;:[0,&quot;Read more →&quot;],&quot;close&quot;:[0,&quot;Close&quot;],&quot;openDetails&quot;:[0,&quot;Open details about {{title}}&quot;],&quot;expandImage&quot;:[0,&quot;Expand image: {{alt}}&quot;],&quot;previousImage&quot;:[0,&quot;Previous image&quot;],&quot;nextImage&quot;:[0,&quot;Next image&quot;]}]}" ssr client="visible" opts="{&quot;name&quot;:&quot;SectionBeyondWork&quot;,&quot;value&quot;:true}" await-children><section class="beyond-work"><h1 class="section-title">Beyond Work</h1><p class="beyond-work__subtitle">What I get up to away from the keyboard — and a few things I build just for fun.</p><div class="beyond-work__fan" style="--total:4"><button type="button" class="hobby-card" style="--i:0" aria-label="Open details about Adventur
